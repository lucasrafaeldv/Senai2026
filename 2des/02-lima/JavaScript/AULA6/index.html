<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanchonete</title>
 <title>Pedidos</title>
</head>

<body>

    <h1>Faça seu pedido</h1>

    <form id="formuPedido">
        
        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>

        <br>
        <br>

        <label for="lanche">Escolha o lanche:</label>

        <select id="lanche" required>
            <option value="">Selecione</option>
            <option value="15">Hambúrguer - R$ 15,00</option>
            <option value="18">X-Salada - R$ 18,00</option>
            <option value="22">X-Bacon - R$ 22,00</option>
        </select>

        <br>
        <br>

        <label for="quantidade">Quantidade:</label>

        <input
            type="number"  id="quantidade"
            min="1"  value="1"  required
        >
        
        <br>
        <br>
        
        <label for="bebida">Escolha a bebida:</label>

        <select id="bebida" required>
            <option value="0">Nenhuma - R$ 0,00</option>
            <option value="6">Refrigerante - R$ 6,00</option>
            <option value="7">Suco - R$ 7,00</option>
        </select>

        <br>
        <br>

        <button type="submit">Finalizar Pedido</button>

    </form>

    <hr>
   
    <div id="resultado"></div>

    <script src="script.js"></script>

</body>

</html>
